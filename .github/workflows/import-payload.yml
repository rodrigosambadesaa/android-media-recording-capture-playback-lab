name: Import prepared project

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import project files
        shell: bash
        run: |
          rm -rf /tmp/project
          mkdir -p /tmp/project
          tar -xJf bootstrap/payload.tar.xz -C /tmp/project
          rsync -a --exclude='.git/' --exclude='.github/workflows/' /tmp/project/ ./
          rm -rf bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import prepared Android practice"
            git push
          fi
